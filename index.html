<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Sketchboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:ital,wght@0,400;0,600;0,700;0,800;1,400;1,700&family=Kalam:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&family=Permanent+Marker&family=Nunito:ital,wght@0,400;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body data-route="boot">
    <div id="stage">
      <svg id="svg" data-tool="select" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".16" />
          </filter>
        </defs>
        <g id="world">
          <g id="layer"></g>
          <g id="ui"></g>
        </g>
      </svg>
      <div id="empty" hidden>
        <b>A blank board</b>
        <span>Pick a tool below, or press <kbd>R</kbd> for a rectangle, <kbd>S</kbd> for a sticky note, <kbd>T</kbd> for text.</span>
        <span class="wide-only">Paste text or a board you copied with <kbd>Ctrl+V</kbd>.</span>
      </div>
      <div id="editor" hidden><div id="edin" contenteditable="true" spellcheck="false"></div></div>
    </div>

    <main id="home" aria-label="Your boards">
      <header class="hhead">
        <span class="brand"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="7.5" fill="#ffd23f" /><circle cx="7" cy="16.5" r="2.3" fill="#1d1b24" /><path d="M8.7 14.8C11.2 9.6 13.2 12.6 15.4 8" fill="none" stroke="#1d1b24" stroke-width="1.8" stroke-linecap="round" /><path d="M13.4 6.4l3 1.4-1.4 3" fill="none" stroke="#1d1b24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>Sketchboard</span>
        <label class="hsearch"
          ><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg
          ><input id="hq" type="search" placeholder="Search boards" aria-label="Search boards" autocomplete="off"
        /></label>
        <div class="hacts">
          <button id="hImport" class="btn" title="Open a .json board file">
            <svg class="ico" viewBox="0 0 24 24"><path d="M3.5 7.5v11h17v-9h-9l-2-2z" /></svg><span>Import</span>
          </button>
          <button id="hTheme" aria-label="Appearance" title="Appearance"></button>
        </div>
      </header>
      <section class="hsec">
        <h2>Start something new</h2>
        <div id="tpls" class="tpls"></div>
      </section>
      <section class="hsec">
        <div class="hrow">
          <h2>Your boards <span id="bcount"></span></h2>
          <div class="seg" id="hsort" role="group" aria-label="Sort boards">
            <button data-sort="recent" class="on">Recent</button><button data-sort="name">Name</button>
          </div>
        </div>
        <div id="boards" class="bgrid"></div>
      </section>
      <footer class="hfoot" id="hfoot"></footer>
    </main>
    <div class="pop" id="bmenu" hidden role="menu"></div>

    <div class="bar" id="tl">
      <button id="menuBtn" aria-label="Menu" title="Menu">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <button id="homeBtn" class="home" aria-label="All boards" title="All boards">
        <svg class="ico chev" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6" /></svg><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="7.5" fill="#ffd23f" /><circle cx="7" cy="16.5" r="2.3" fill="#1d1b24" /><path d="M8.7 14.8C11.2 9.6 13.2 12.6 15.4 8" fill="none" stroke="#1d1b24" stroke-width="1.8" stroke-linecap="round" /><path d="M13.4 6.4l3 1.4-1.4 3" fill="none" stroke="#1d1b24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
      <button id="titleBtn" class="title" title="Rename board">Sketchboard</button>
      <span id="status">Saved</span>
    </div>

    <div class="bar" id="tr">
      <button id="styleBtn" class="narrow sel-only" aria-label="Style" title="Style">
        <svg class="ico" viewBox="0 0 24 24">
          <path d="M12 3a9 9 0 100 18c1.2 0 1.6-1 1.1-2-.6-1.2.2-2.5 1.5-2.5H17a4 4 0 004-4c0-5-4-9.5-9-9.5z" />
          <circle cx="7.5" cy="11" r="1.2" />
          <circle cx="10.5" cy="7" r="1.2" />
          <circle cx="15.5" cy="7.5" r="1.2" />
        </svg>
      </button>
      <button id="editBtn" class="narrow sel-only" aria-label="Edit text" title="Edit text">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 19h6M7 19V6M3.5 6h7M14 19l3.5-9 3.5 9M15.2 16h4.6" /></svg>
      </button>
      <button id="themeBtn" class="wide" aria-label="Appearance" title="Appearance"></button>
      <button id="multiBtn" aria-label="Select several" title="Select several: tap shapes to add them, drag to box-select">
        <svg class="ico" viewBox="0 0 24 24">
          <rect x="3.5" y="3.5" width="12" height="12" rx="2.5" stroke-dasharray="3 2.6" />
          <path d="M15.5 14v6.5M12.3 17.3h6.4" />
        </svg>
      </button>
      <button id="undoBtn" aria-label="Undo" title="Undo (Ctrl+Z)">
        <svg class="ico" viewBox="0 0 24 24">
          <path d="M9 14L4 9l5-5" />
          <path d="M4 9h10.5a5.5 5.5 0 010 11H11" />
        </svg>
      </button>
      <button id="redoBtn" aria-label="Redo" title="Redo (Ctrl+Shift+Z)">
        <svg class="ico" viewBox="0 0 24 24">
          <path d="M15 14l5-5-5-5" />
          <path d="M20 9H9.5a5.5 5.5 0 000 11H13" />
        </svg>
      </button>
      <button class="narrow" data-zoom="fit" aria-label="Zoom to fit">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
      </button>
    </div>

    <div class="bar wide" id="zb">
      <button data-zoom="out" aria-label="Zoom out" title="Zoom out (Ctrl -)">
        <svg class="ico" viewBox="0 0 24 24"><path d="M6 12h12" /></svg>
      </button>
      <button id="zl" data-zoom="reset" title="Reset to 100%">100%</button>
      <button data-zoom="in" aria-label="Zoom in" title="Zoom in (Ctrl +)">
        <svg class="ico" viewBox="0 0 24 24"><path d="M6 12h12M12 6v12" /></svg>
      </button>
      <button data-zoom="fit" aria-label="Zoom to fit" title="Zoom to fit (Shift+1)">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
      </button>
    </div>

    <nav class="bar" id="tray" aria-label="Tools">
      <button data-tool="select" title="Select (V)" aria-label="Select">
        <svg class="ico" viewBox="0 0 24 24"><path d="M6 3.5l12.5 7.2-5.6 1.6-2.6 5.4z" /></svg>
      </button>
      <button data-tool="hand" title="Hand (H)" aria-label="Hand">
        <svg class="ico" viewBox="0 0 24 24">
          <path
            d="M8 12.5V6a1.5 1.5 0 013 0v5.5m0-.5V4.5a1.5 1.5 0 013 0V11m0-.5V6a1.5 1.5 0 013 0v7.5a7 7 0 01-7 7h-.5a6.5 6.5 0 01-5.4-2.9L3.4 14a1.6 1.6 0 012.5-2L8 14"
          />
        </svg>
      </button>
      <button data-tool="shape" id="shapeBtn" title="Shapes (R)" aria-label="Shapes"></button>
      <button data-tool="sticky" title="Sticky note (S)" aria-label="Sticky note">
        <svg class="ico" viewBox="0 0 24 24">
          <path d="M4.5 4.5h15v9.5l-5.5 5.5H4.5z" />
          <path d="M14 19.5V14h5.5" />
        </svg>
      </button>
      <button data-tool="text" title="Text (T)" aria-label="Text">
        <svg class="ico" viewBox="0 0 24 24"><path d="M5 7V4.5h14V7M12 4.5v15M9 19.5h6" /></svg>
      </button>
      <button data-tool="line" title="Connector (A)" aria-label="Connector">
        <svg class="ico" viewBox="0 0 24 24"><path d="M5 19L19 5M11 5h8v8" /></svg>
      </button>
      <button data-tool="pen" title="Marker (P)" aria-label="Marker">
        <svg class="ico" viewBox="0 0 24 24">
          <path d="M15 4.5l4.5 4.5L9 19.5H4.5V15z" />
          <path d="M12.5 7l4.5 4.5" />
        </svg>
      </button>
      <button id="symBtn" title="Symmetry mode (M): snap to centres, edges and equal gaps" aria-label="Symmetry mode">
        <svg class="ico" viewBox="0 0 24 24">
          <path d="M12 3v18" stroke-dasharray="2.4 2.4" />
          <path d="M9.5 7L4 12l5.5 5z" />
          <path d="M14.5 7L20 12l-5.5 5z" />
        </svg>
      </button>
      <span class="sep wide"></span>
      <button id="lockBtn" class="wide" title="Keep tool active after drawing (Q)" aria-label="Keep tool active">
        <svg class="ico" viewBox="0 0 24 24">
          <rect x="5" y="11" width="14" height="9" rx="2" />
          <path d="M8 11V8a4 4 0 017.6-1.8" />
        </svg>
      </button>
    </nav>

    <div class="pop" id="shapes" hidden></div>
    <div class="pop" id="alignpop" hidden role="toolbar" aria-label="Align and distribute"></div>

    <div class="pop" id="menu" hidden>
      <button data-act="newBoard"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" /><path d="M12 8.5v7M8.5 12h7" /></svg>New board</button>
      <button data-act="home"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5" /><rect x="13" y="4" width="7" height="7" rx="1.5" /><rect x="4" y="13" width="7" height="7" rx="1.5" /><rect x="13" y="13" width="7" height="7" rx="1.5" /></svg>All boards</button>
      <button data-act="rename"><svg class="ico" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z" /><path d="M13.5 6.5l4 4" /></svg>Rename board</button>
      <button data-act="dupBoard"><svg class="ico" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2" /><path d="M15.5 8.5V4.5h-11v11h4" /></svg>Duplicate board</button>
      <hr />
      <button data-act="png">
        <svg class="ico" viewBox="0 0 24 24">
          <rect x="4" y="5" width="16" height="14" rx="2" />
          <path d="M4 16l5-5 4 4 2-2 5 5" /></svg
        >Export image (PNG)
      </button>
      <button data-act="svg">
        <svg class="ico" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" /></svg>Export vector (SVG)
      </button>
      <button data-act="json">
        <svg class="ico" viewBox="0 0 24 24">
          <path d="M6 3.5h8l4 4v13H6z" />
          <path d="M14 3.5v4h4" /></svg
        >Save board file
      </button>
      <button data-act="open">
        <svg class="ico" viewBox="0 0 24 24"><path d="M3.5 7.5v11h17v-9h-9l-2-2z" /></svg>Import board file
      </button>
      <hr />
      <button data-act="all">
        <svg class="ico" viewBox="0 0 24 24">
          <rect x="4" y="4" width="16" height="16" rx="3" stroke-dasharray="3 2.6" />
          <path d="M8.5 12.2l2.4 2.4 4.6-5" /></svg
        >Select all
      </button>
      <button data-act="grid">
        <svg class="ico" viewBox="0 0 24 24">
          <circle cx="6" cy="6" r=".6" />
          <circle cx="12" cy="6" r=".6" />
          <circle cx="18" cy="6" r=".6" />
          <circle cx="6" cy="12" r=".6" />
          <circle cx="12" cy="12" r=".6" />
          <circle cx="18" cy="12" r=".6" />
          <circle cx="6" cy="18" r=".6" />
          <circle cx="12" cy="18" r=".6" />
          <circle cx="18" cy="18" r=".6" /></svg
        >Show dot grid<span class="chk" id="gridChk"></span>
      </button>
      <button data-act="snap">
        <svg class="ico" viewBox="0 0 24 24">
          <path d="M5 5h6v6H5zM13 13h6v6h-6z" />
          <path d="M11 8h5v5" /></svg
        >Snap to grid<span class="chk" id="snapChk"></span>
      </button>
      <button data-act="sym">
        <svg class="ico" viewBox="0 0 24 24">
          <path d="M12 3v18" stroke-dasharray="2.4 2.4" />
          <path d="M9.5 7L4 12l5.5 5z" />
          <path d="M14.5 7L20 12l-5.5 5z" /></svg
        >Symmetry mode<span class="chk" id="symChk"></span>
      </button>
      <button data-act="theme">
        <svg class="ico" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8" />
          <path d="M12 4v16a8 8 0 000-16z" fill="currentColor" /></svg
        >Appearance<span class="chk" id="modeChk"></span>
      </button>
      <button data-act="keys">
        <svg class="ico" viewBox="0 0 24 24">
          <rect x="3" y="6" width="18" height="12" rx="2" />
          <path d="M7 10h1M11 10h2M16 10h1M7 14h10" /></svg
        >Shortcuts and tips
      </button>
      <hr />
      <button data-act="clear" style="color: #e03131">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13" /></svg>Clear board
      </button>
    </div>

    <div class="bar" id="sbar" hidden role="toolbar" aria-label="Selection"></div>
    <aside id="panel" aria-label="Style"></aside>
    <div id="toast" role="status"></div>
    <div id="modal" hidden><div class="mcard" id="mcard"></div></div>
    <input type="color" id="cpick" tabindex="-1" aria-hidden="true" />
    <input type="file" id="file" accept=".json,application/json" multiple hidden />

    <script src="js/core.js"></script>
    <script src="js/geometry.js"></script>
    <script src="js/text.js"></script>
    <script src="js/render.js"></script>
    <script src="js/history.js"></script>
    <script src="js/create.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/editing.js"></script>
    <script src="js/ops.js"></script>
    <script src="js/pointer.js"></script>
    <script src="js/keyboard.js"></script>
    <script src="js/panel.js"></script>
    <script src="js/selbar.js"></script>
    <script src="js/chrome.js"></script>
    <script src="js/export.js"></script>
    <script src="js/store.js"></script>
    <script src="js/boards.js"></script>
    <script src="js/templates.js"></script>
    <script src="js/home.js"></script>
    <script src="js/actions.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
