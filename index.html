<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sketchboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:ital,wght@0,400;0,600;0,700;0,800;1,400;1,700&family=Kalam:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&family=Permanent+Marker&family=Nunito:ital,wght@0,400;0,800;1,400&display=swap" rel="stylesheet">
<style>
/* VOICE: a studio tool — warm paper, ink-black tools, one marker-yellow highlight
   IDEA: a drafting table: cream paper board with a faint grain and dot grid, an ink tool tray along the bottom, whatever is live is lit in marker yellow
   PICTURE: the board full screen on warm paper, a glass top bar, the dark tray rising at the bottom, a small ink toolbar floating over whatever is selected
   COLOUR and TYPE: paper #f8f5ee / night #141319, ink #1d1b24, marker yellow #ffd23f, selection indigo #3a57ff; Bricolage Grotesque for headings, Figtree for controls, Kalam hand lettering inside shapes
   LAYOUT: canvas full bleed; menu + history top corners, tools bottom-centre, selection toolbar follows the selection, style card left (compact on phones)
*/
:root{color-scheme:light dark;--bg:light-dark(#f8f5ee,#141319);--dot:light-dark(#d3cdbd,#34313d);--ink:light-dark(#1d1b24,#efecf4);--card:light-dark(#fffdf8,#201e28);--line:light-dark(#e7e1d3,#34313e);--muted:light-dark(#6c6657,#a39eb2);--hover:light-dark(#f2eee4,#2c2935);--tray:light-dark(#1c1a21,#2e2b38);--acc:#ffd23f;--sel:#3a57ff;
 --disp:'Bricolage Grotesque',Figtree,system-ui,sans-serif;--glass:light-dark(rgba(255,253,248,.97),rgba(32,30,40,.96));--glow:light-dark(rgba(255,255,255,.75),rgba(130,120,255,.09));--grain:light-dark(#7a6a40,#ffffff);
 --lift:0 1px 0 light-dark(rgba(255,255,255,.95),rgba(255,255,255,.05)) inset,0 12px 30px -12px light-dark(rgba(60,44,12,.32),rgba(0,0,0,.65)),0 2px 6px light-dark(rgba(60,44,12,.08),rgba(0,0,0,.3));--noiseL:none;--noiseD:none}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root[data-mode=light]{color-scheme:light}:root[data-mode=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#edin,.mcard textarea,input{-webkit-user-select:text;user-select:text}
button,.bar,.pop{touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;position:fixed;inset:0;width:100%;touch-action:none;background:var(--bg);color:var(--ink);font:15px/1.4 Figtree,system-ui,sans-serif;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.5px)}
#stage::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:var(--noiseL);background-size:128px 128px}
:root[data-mode=dark] #stage::before{background-image:var(--noiseD)}
@media (prefers-color-scheme:dark){:root:not([data-mode=light]) #stage::before{background-image:var(--noiseD)}}
#stage.nogrid{background-image:none}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#svg text{pointer-events:none}
#ui{pointer-events:none}#ui [data-h]{pointer-events:auto}
#svg[data-tool=select] [data-id]{cursor:move}
#svg[data-tool=hand],#svg.pan{cursor:grab}
#svg[data-tool=shape],#svg[data-tool=sticky],#svg[data-tool=text],#svg[data-tool=line],#svg[data-tool=pen]{cursor:crosshair}
[data-h=nw],[data-h=se]{cursor:nwse-resize}[data-h=ne],[data-h=sw]{cursor:nesw-resize}[data-h=n],[data-h=s]{cursor:ns-resize}[data-h=e],[data-h=w]{cursor:ew-resize}[data-h=a],[data-h=b]{cursor:grab}
#editor{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none}
#editor[hidden]{display:none}
#edin{pointer-events:auto;outline:none;width:100%;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.25;min-width:6px;max-width:100%;caret-color:var(--sel)}
#editor.lbl #edin{width:auto;background:var(--bg);padding:0 4px;border-radius:4px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;border-radius:11px;min-width:40px;min-height:40px;display:inline-grid;place-items:center;padding:0;transition:background .15s,color .15s,transform .12s,box-shadow .18s}
button:hover{background:var(--hover)}
button:active:not(:disabled){transform:scale(.93)}
button:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
button:disabled{opacity:.32;cursor:default;background:none}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bar{position:fixed;z-index:5;display:flex;gap:2px;align-items:center;background:var(--card);background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:4px;box-shadow:var(--lift)}
#tl{top:12px;left:12px;transform-origin:0 0;animation:rise .55s cubic-bezier(.2,.9,.25,1) both}
#tr{top:12px;right:12px;transform-origin:100% 0;animation:rise .55s .06s cubic-bezier(.2,.9,.25,1) both}
#tl,#tr,#panel,#sbar{translate:var(--vvl,0px) var(--vvt,0px)}
#zb{bottom:16px;right:12px;animation:rise .55s .18s cubic-bezier(.2,.9,.25,1) both;transform-origin:100% 100%}
#tr button.on{background:var(--acc);color:#1d1b24}
.brand{display:flex;align-items:center;gap:8px;font:800 17px/1 var(--disp);letter-spacing:-.025em;padding:0 8px 0 4px;white-space:nowrap}
.logo{width:26px;height:26px;flex:none}
#status{font-size:12.5px;color:var(--muted);padding-right:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
#zl{min-width:58px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
#tray{bottom:16px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#2a2732,#1a181f);background:linear-gradient(180deg,light-dark(#2a2732,#383442),light-dark(#1a181f,#262330));border-color:rgba(255,255,255,.07);color:#f6f3fa;padding:6px;border-radius:21px;gap:3px;box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 24px 46px -14px rgba(18,10,40,.6),0 3px 9px rgba(18,10,40,.28);animation:lift .6s .12s cubic-bezier(.2,.9,.25,1) both}
#tray button{width:46px;height:46px;border-radius:14px;position:relative}
#tray button:hover{background:rgba(255,255,255,.1)}
#tray button.on{background:var(--acc);color:#1d1b24;box-shadow:0 2px 0 rgba(0,0,0,.3),0 8px 16px -6px rgba(255,210,63,.6)}
#tray .sep{width:1px;height:28px;background:rgba(255,255,255,.16);margin:0 4px}
#tray .car{position:absolute;right:4px;bottom:4px;width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;opacity:.55}
.pop{position:fixed;z-index:9;background:var(--card);background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:var(--lift),0 20px 50px -20px rgba(40,28,8,.35);animation:pop .17s cubic-bezier(.2,.9,.3,1.15) both}
.pop[hidden]{display:none!important}
#shapes{bottom:86px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(6,48px);gap:4px}
#shapes button{width:48px;height:48px}
#shapes button.on{background:var(--hover);color:var(--sel);box-shadow:inset 0 0 0 1.5px var(--sel)}
#alignpop{display:grid;grid-template-columns:repeat(5,42px);gap:2px;transform-origin:50% 100%;z-index:10}
#alignpop button{width:42px;height:42px;min-width:0;min-height:0}
#alignpop button:hover{background:var(--hover);color:var(--sel)}
#menu{top:64px;left:12px;width:256px;display:grid;transform-origin:0 0}
#panel,.mcard,.mcard textarea{touch-action:pan-y;overscroll-behavior:contain}
#menu button{justify-content:start;display:flex;gap:11px;padding:0 10px;min-height:42px;text-align:left;width:100%;font-weight:500}
#menu hr{border:0;border-top:1px solid var(--line);margin:6px 2px}
#menu .chk{margin-left:auto;color:var(--sel);font-weight:800;font-size:13px}
#panel{position:fixed;z-index:4;left:12px;top:72px;width:236px;max-height:calc(100dvh - 170px);overflow:auto;background:var(--card);background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--lift);display:none;transform-origin:0 0}
body.has-sel #panel:not(:empty){display:block;animation:pop .22s cubic-bezier(.2,.9,.3,1.1) both}
.sec{margin-bottom:13px}.sec:last-child{margin-bottom:0}
.sec h4{margin:0 0 7px;font:700 10.5px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sw{display:flex;flex-wrap:wrap;gap:7px}
.sw button{min-width:0;min-height:0;width:28px;height:28px;border-radius:50%;border:1px solid rgba(127,127,140,.3);box-shadow:inset 0 -2px 3px rgba(0,0,0,.07),inset 0 1px 1px rgba(255,255,255,.35)}
.sw button:hover{transform:scale(1.1)}
.sw button.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--sel)}
.sw .none{background:linear-gradient(135deg,transparent 44%,#e03131 44% 56%,transparent 56%),var(--card)}
.sw .inkc{background:var(--ink)}
.seg{display:flex;background:var(--hover);border-radius:12px;padding:3px;gap:2px;margin-bottom:6px;box-shadow:inset 0 1px 2px rgba(60,44,12,.08)}
.seg button{flex:1;min-height:34px;min-width:0;border-radius:9px;font-size:14px;font-weight:500}
.seg button.on{background:var(--card);box-shadow:0 1px 2px rgba(60,44,12,.2),0 2px 6px -2px rgba(60,44,12,.2);color:var(--ink)}
.seg .ico{width:20px;height:20px}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.grid6 button{min-width:0;min-height:34px}
.grid6 button.on{background:var(--hover);color:var(--sel);box-shadow:inset 0 0 0 1.5px var(--sel)}
.tabs{display:flex;gap:4px;margin:-4px -4px 13px;padding:3px;background:var(--hover);border-radius:13px;box-shadow:inset 0 1px 2px rgba(60,44,12,.08)}.tabs button{flex:1;min-height:36px;font:700 14px var(--disp);color:var(--muted);border-radius:10px}.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(60,44,12,.2),0 2px 6px -2px rgba(60,44,12,.2)}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.fgrid button{min-height:42px;background:var(--hover);font-size:17px;border-radius:10px}.fgrid button.on{box-shadow:inset 0 0 0 2px var(--sel)}
.step{display:flex;align-items:center;gap:4px;margin-bottom:6px}.step b{flex:1;text-align:center;font:700 17px var(--disp);font-variant-numeric:tabular-nums}.step button{background:var(--hover);min-width:48px;font-size:20px}
.sw .add{background:conic-gradient(#f03e3e,#fab005,#40c057,#15aabf,#4c6ef5,#be4bdb,#f03e3e);position:relative}.sw .add::after{content:'+';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;text-shadow:0 0 3px rgba(0,0,0,.6)}
.sw .auto{background:linear-gradient(135deg,#1e1e1e 50%,#fff 50%)}
#cpick{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.pclose{display:none;position:sticky;top:-8px;margin:-4px -4px 2px auto;width:32px;height:32px;min-width:0;min-height:0;font-size:20px;color:var(--muted);background:var(--card);z-index:1}
.row{display:flex;gap:4px}.row button{flex:1;min-width:0;background:var(--hover)}
.row button:hover{background:var(--line)}
.row .danger{color:#e03131}
input[type=range]{width:100%;accent-color:var(--sel);height:28px}
#sbar{left:0;top:0;z-index:6;background:linear-gradient(180deg,#2a2732,#1c1a22);background:linear-gradient(180deg,light-dark(#2a2732,#383442),light-dark(#1c1a22,#2a2733));color:#f6f3fa;border-color:rgba(255,255,255,.08);padding:4px;gap:1px;border-radius:17px;box-shadow:0 1px 0 rgba(255,255,255,.09) inset,0 16px 34px -12px rgba(18,10,40,.6),0 2px 7px rgba(18,10,40,.3);transform-origin:50% 100%;animation:pop .17s cubic-bezier(.2,.9,.3,1.2) both}
#sbar[hidden]{display:none}
#sbar button{width:38px;height:38px;min-width:0;min-height:0;border-radius:13px}
#sbar button:hover{background:rgba(255,255,255,.1)}
#sbar button.on{background:var(--acc);color:#1d1b24;box-shadow:0 2px 0 rgba(0,0,0,.28)}
#sbar button.danger{color:#ff938a}#sbar button.danger:hover{background:rgba(255,92,80,.22);color:#ffb3ac}
#sbar .sep{width:1px;height:22px;background:rgba(255,255,255,.16);margin:0 3px;flex:none}
#sbar .cnt{font:700 13px var(--disp);padding:0 10px 0 9px;white-space:nowrap;letter-spacing:.01em}
#toast{position:fixed;z-index:20;top:68px;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--tray);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;box-shadow:0 14px 30px -10px rgba(18,10,40,.55);max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%)}
#modal{position:fixed;inset:0;z-index:30;background:rgba(14,10,22,.5);display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
.mcard{background:var(--card);border-radius:24px;padding:22px;width:min(520px,100%);max-height:86dvh;overflow:auto;box-shadow:0 30px 70px -20px rgba(18,10,40,.55);animation:pop .22s cubic-bezier(.2,.9,.3,1.1) both}
.mcard h3{margin:0 0 10px;font:800 23px/1.1 var(--disp);letter-spacing:-.02em}
.mcard p{margin:0 0 12px;color:var(--muted)}
.mcard img{max-width:100%;border:1px solid var(--line);border-radius:12px;display:block;margin-bottom:12px}
.mcard textarea{width:100%;height:160px;font:13px/1.4 'JetBrains Mono',monospace;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--bg);color:var(--ink)}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.btn{padding:0 18px;background:var(--hover);font-weight:600;border-radius:13px}
.btn.pri{background:var(--sel);color:#fff;box-shadow:0 8px 16px -8px var(--sel)}.btn.red{background:#e03131;color:#fff}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.keys kbd{font:12px 'JetBrains Mono',monospace;background:var(--hover);border:1px solid var(--line);border-radius:7px;padding:2px 7px;white-space:nowrap;justify-self:start}
.narrow{display:none!important}
@keyframes rise{from{opacity:0;scale:.9}}
@keyframes lift{from{opacity:0;translate:0 18px}}
@keyframes pop{from{opacity:0;scale:.93}}
@media (max-width:600px){
 #panel{left:8px;right:auto;top:62px;bottom:auto;width:min(184px,50vw);max-height:min(var(--pmax,calc(100dvh - 150px)),62dvh);padding:8px 8px 10px;border-radius:16px}
 #panel .sec{margin-bottom:9px}#panel .sec h4{margin-bottom:5px;font-size:10px}
 #panel .sw{gap:5px}#panel .sw button{width:24px;height:24px}
 #panel .seg{padding:2px;margin-bottom:4px}#panel .seg button{min-height:30px;font-size:13px}#panel .seg .ico{width:18px;height:18px}
 #panel .grid6 button{min-height:28px}#panel .grid6 .ico{width:18px!important;height:18px!important}
 #panel .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}#panel .fgrid button{min-height:30px;font-size:13px}#panel .seg button{padding:0 2px}
 #panel .step button{min-width:40px;min-height:32px;font-size:18px}#panel .tabs{margin:0 0 8px}#panel .tabs button{min-height:30px;font-size:13px}
 #panel .row button{min-height:34px}#panel .pclose{display:grid}
 body.has-sel #panel:not(:empty){display:none}
 body.has-sel.panel-open #panel:not(:empty){display:block}
 body.has-sel .narrow.sel-only,.narrow:not(.sel-only){display:inline-grid!important}
 .wide{display:none!important}
 #tray{bottom:calc(env(safe-area-inset-bottom,0px) + 20px);padding:5px;gap:1px}
 #tray button{width:38px;height:44px}
 #alignpop{grid-template-columns:repeat(5,40px)}
 #shapes{bottom:calc(env(safe-area-inset-bottom,0px) + 82px);grid-template-columns:repeat(6,44px)}
 #shapes button{width:44px;height:44px}
 #sbar button{width:35px;height:38px}
 #status{max-width:34vw}
 .brand{display:none}
 #status{display:none}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}#tl,#tr,#zb,#tray,#sbar,.pop,.mcard,#panel{animation:none!important}button{transition:none}}
</style>
</head>
<body>
<div id="stage">
 <svg id="svg" data-tool="select" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".16"/></filter></defs>
  <g id="world"><g id="layer"></g><g id="ui"></g></g>
 </svg>
 <div id="editor" hidden><div id="edin" contenteditable="true" spellcheck="false"></div></div>
</div>

<div class="bar" id="tl">
 <button id="menuBtn" aria-label="Menu" title="Menu"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
 <span class="brand"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="7.5" fill="#ffd23f"/><circle cx="7" cy="16.5" r="2.3" fill="#1d1b24"/><path d="M8.7 14.8C11.2 9.6 13.2 12.6 15.4 8" fill="none" stroke="#1d1b24" stroke-width="1.8" stroke-linecap="round"/><path d="M13.4 6.4l3 1.4-1.4 3" fill="none" stroke="#1d1b24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Sketchboard</span>
 <span id="status">Saved on this device</span>
</div>

<div class="bar" id="tr">
 <button id="styleBtn" class="narrow sel-only" aria-label="Style" title="Style"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18c1.2 0 1.6-1 1.1-2-.6-1.2.2-2.5 1.5-2.5H17a4 4 0 004-4c0-5-4-9.5-9-9.5z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15.5" cy="7.5" r="1.2"/></svg></button>
 <button id="editBtn" class="narrow sel-only" aria-label="Edit text" title="Edit text"><svg class="ico" viewBox="0 0 24 24"><path d="M4 19h6M7 19V6M3.5 6h7M14 19l3.5-9 3.5 9M15.2 16h4.6"/></svg></button>
 <button id="themeBtn" class="wide" aria-label="Appearance" title="Appearance"></button>
 <button id="multiBtn" aria-label="Select several" title="Select several: tap shapes to add them, drag to box-select"><svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="12" height="12" rx="2.5" stroke-dasharray="3 2.6"/><path d="M15.5 14v6.5M12.3 17.3h6.4"/></svg></button>
 <button id="undoBtn" aria-label="Undo" title="Undo (Ctrl+Z)"><svg class="ico" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg></button>
 <button id="redoBtn" aria-label="Redo" title="Redo (Ctrl+Shift+Z)"><svg class="ico" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg></button>
 <button class="narrow" data-zoom="fit" aria-label="Zoom to fit"><svg class="ico" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<div class="bar wide" id="zb">
 <button data-zoom="out" aria-label="Zoom out" title="Zoom out (Ctrl -)"><svg class="ico" viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
 <button id="zl" data-zoom="reset" title="Reset to 100%">100%</button>
 <button data-zoom="in" aria-label="Zoom in" title="Zoom in (Ctrl +)"><svg class="ico" viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
 <button data-zoom="fit" aria-label="Zoom to fit" title="Zoom to fit (Shift+1)"><svg class="ico" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<nav class="bar" id="tray" aria-label="Tools">
 <button data-tool="select" title="Select (V)" aria-label="Select"><svg class="ico" viewBox="0 0 24 24"><path d="M6 3.5l12.5 7.2-5.6 1.6-2.6 5.4z"/></svg></button>
 <button data-tool="hand" title="Hand (H)" aria-label="Hand"><svg class="ico" viewBox="0 0 24 24"><path d="M8 12.5V6a1.5 1.5 0 013 0v5.5m0-.5V4.5a1.5 1.5 0 013 0V11m0-.5V6a1.5 1.5 0 013 0v7.5a7 7 0 01-7 7h-.5a6.5 6.5 0 01-5.4-2.9L3.4 14a1.6 1.6 0 012.5-2L8 14"/></svg></button>
 <button data-tool="shape" id="shapeBtn" title="Shapes (R)" aria-label="Shapes"></button>

{const st=document.documentElement.style;st.setProperty('--noiseL',grainTile(122,106,64,20));st.setProperty('--noiseD',grainTile(255,255,255,9))}
